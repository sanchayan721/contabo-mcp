name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste Contabo credentials, API tokens, or access tokens in this form.**
        Request-ids from error messages are fine and helpful.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact tool call and the error text (request-ids welcome).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The agent call that failed, e.g. contabo_instances(operation="list", page=1)
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Which agent client?
      options: [OpenAI Agents SDK, Claude Desktop, Codex CLI, Cursor, Other]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (`node --version`)
    validations:
      required: true
